services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPRINT_DB: /data/reprint.db
    volumes:
      - reprint-data:/data
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim 自带 python，用标准库探测，无需额外安装 curl
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

volumes:
  reprint-data:
